<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyric Scroll</title>

<style>
  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: auto;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #111111;
    transition: background 0.2s, color 0.2s;
  }

  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: #f5f5f5;
    padding: 12px 15px;
    border-bottom: 1px solid #ccc;
  }

  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .app-title {
    font-size: 20px;
    font-weight: bold;
    margin-right: auto;
  }

  button {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 15px;
    cursor: pointer;
    background: #222;
    color: white;
  }

  button:active {
    transform: scale(0.97);
  }

  .secondary {
    background: #ddd;
    color: #111;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 120px 15px 40px;
  }

  h1, h2 {
    margin-top: 0;
  }

  .song-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .song-item {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 12px;
  }

  .song-name {
    flex: 1;
    min-width: 0;
    font-size: 18px;
    cursor: pointer;
    word-break: break-word;
  }

  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  textarea,
  input[type="text"] {
    width: 100%;
    font-size: 17px;
    padding: 12px;
    border: 1px solid #aaa;
    border-radius: 8px;
    margin-bottom: 15px;
    font-family: inherit;
  }

  textarea {
    min-height: 400px;
    resize: vertical;
  }

  label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .reader-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
  }

  .reader-controls button {
    min-width: 48px;
  }

  .speed-box {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 220px;
  }

  #speedSlider {
    flex: 1;
  }

  #speedValue {
    min-width: 45px;
    text-align: center;
    font-weight: bold;
  }

  #lyricsDisplay {
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 24px;
    padding-bottom: 80vh;
  }

  .hidden {
    display: none !important;
  }

  .empty {
    color: #666;
    padding: 20px 0;
  }

  /* DARK MODE */

  body.dark {
    background: #111;
    color: #eee;
  }

  body.dark header {
    background: #111;
    border-bottom-color: #333;
  }

  body.dark .song-item,
  body.dark .reader-controls {
    border-color: #444;
  }

  body.dark .secondary {
    background: #333;
    color: #eee;
  }

  body.dark textarea,
  body.dark input[type="text"] {
    background: #222;
    color: #eee;
    border-color: #555;
  }

  body.dark .empty {
    color: #aaa;
  }

  @media (max-width: 600px) {
    .app-title {
      width: 100%;
      margin-bottom: 4px;
    }

    .header-inner {
      gap: 6px;
    }

    header button {
      flex: 1;
    }

    .song-item {
      flex-wrap: wrap;
    }

    .song-name {
      width: 100%;
      flex-basis: 100%;
      margin-bottom: 4px;
    }

    .reader-controls {
      align-items: stretch;
    }

    .speed-box {
      width: 100%;
      flex-basis: 100%;
    }

    #lyricsDisplay {
      font-size: 24px;
    }
  }
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="app-title">🎵 Lyric Scroll</div>

    <button id="addSongButton">＋ Add Song</button>

    <button id="topScrollButton">▶ Start</button>

    <button id="darkModeButton">🌙 Dark</button>
  </div>
</header>

<main>

  <!-- SONG LIST -->

  <section id="songListScreen">

    <h1>My Songs</h1>

    <div id="songList" class="song-list"></div>

    <div id="emptyMessage" class="empty">
      No songs yet. Tap “Add Song” to get started.
    </div>

  </section>


  <!-- EDITOR -->

  <section id="editorScreen" class="hidden">

    <h2 id="editorHeading">Add Song</h2>

    <label for="songTitle">Song Title</label>

    <input
      type="text"
      id="songTitle"
      placeholder="Enter song title"
    >

    <label for="songLyrics">Lyrics</label>

    <textarea
      id="songLyrics"
      placeholder="Paste or type your lyrics here..."
    ></textarea>

    <div class="controls">

      <button id="saveSongButton">
        Save Song
      </button>

      <button
        id="cancelEditButton"
        class="secondary"
      >
        Cancel
      </button>

    </div>

  </section>


  <!-- READER -->

  <section id="readerScreen" class="hidden">

    <h2 id="readerTitle"></h2>

    <div class="controls">

      <button
        id="backToSongsButton"
        class="secondary"
      >
        ← Songs
      </button>

      <button
        id="resetButton"
        class="secondary"
      >
        ↺ Reset
      </button>

      <button
        id="fontSmallerButton"
        class="secondary"
      >
        A−
      </button>

      <button
        id="fontLargerButton"
        class="secondary"
      >
        A+
      </button>

    </div>


    <div class="reader-controls">

      <div class="speed-box">

        <strong>Speed:</strong>

        <input
          type="range"
          id="speedSlider"
          min="0"
          max="10"
          step="1"
          value="5"
        >

        <span id="speedValue">5</span>

      </div>

    </div>


    <div id="lyricsDisplay"></div>

  </section>

</main>


<script>

  /* --------------------------------
     APP DATA
  -------------------------------- */

  let songs = JSON.parse(
    localStorage.getItem("lyricScrollSongs") || "[]"
  );

  let currentSong = null;

  let editingSongId = null;

  let fontSize = 24;

  let scrollSpeed = 42;

  let isScrolling = false;

  let scrollAnimation = null;

  let lastTime = null;


  /* --------------------------------
     SPEED SETTINGS
  -------------------------------- */

  const speeds = {

    0: 0,

    // Slower than before
    1: 7,

    2: 13,

    3: 21,

    4: 31,

    5: 42,

    6: 54,

    7: 68,

    8: 84,

    9: 105,

    10: 130

  };


  /* --------------------------------
     ELEMENTS
  -------------------------------- */

  const songListScreen =
    document.getElementById("songListScreen");

  const editorScreen =
    document.getElementById("editorScreen");

  const readerScreen =
    document.getElementById("readerScreen");

  const songList =
    document.getElementById("songList");

  const emptyMessage =
    document.getElementById("emptyMessage");

  const songTitle =
    document.getElementById("songTitle");

  const songLyrics =
    document.getElementById("songLyrics");

  const editorHeading =
    document.getElementById("editorHeading");

  const readerTitle =
    document.getElementById("readerTitle");

  const lyricsDisplay =
    document.getElementById("lyricsDisplay");

  const speedSlider =
    document.getElementById("speedSlider");

  const speedValue =
    document.getElementById("speedValue");

  const topScrollButton =
    document.getElementById("topScrollButton");


  /* --------------------------------
     SAVE SONGS
  -------------------------------- */

  function saveSongs() {

    localStorage.setItem(
      "lyricScrollSongs",
      JSON.stringify(songs)
    );

  }


  /* --------------------------------
     SHOW SCREEN
  -------------------------------- */

  function showScreen(screen) {

    songListScreen.classList.add("hidden");

    editorScreen.classList.add("hidden");

    readerScreen.classList.add("hidden");

    screen.classList.remove("hidden");

    window.scrollTo(0, 0);

  }


  /* --------------------------------
     SONG LIST
  -------------------------------- */

  function renderSongList() {

    songList.innerHTML = "";

    if (songs.length === 0) {

      emptyMessage.classList.remove("hidden");

      return;

    }

    emptyMessage.classList.add("hidden");


    songs.forEach(song => {

      const item =
        document.createElement("div");

      item.className = "song-item";


      const name =
        document.createElement("div");

      name.className = "song-name";

      name.textContent = song.title;

      name.addEventListener(
        "click",
        () => openSong(song.id)
      );


      const editButton =
        document.createElement("button");

      editButton.textContent = "Edit";

      editButton.className = "secondary";

      editButton.addEventListener(
        "click",
        () => editSong(song.id)
      );


      const deleteButton =
        document.createElement("button");

      deleteButton.textContent = "Delete";

      deleteButton.className = "secondary";

      deleteButton.addEventListener(
        "click",
        () => deleteSong(song.id)
      );


      item.appendChild(name);

      item.appendChild(editButton);

      item.appendChild(deleteButton);

      songList.appendChild(item);

    });

  }


  /* --------------------------------
     ADD SONG
  -------------------------------- */

  function addSong() {

    stopScrolling();

    editingSongId = null;

    songTitle.value = "";

    songLyrics.value = "";

    editorHeading.textContent =
      "Add Song";

    showScreen(editorScreen);

    songTitle.focus();

  }


  /* --------------------------------
     EDIT SONG
  -------------------------------- */

  function editSong(id) {

    const song =
      songs.find(s => s.id === id);

    if (!song) return;

    stopScrolling();

    editingSongId = id;

    songTitle.value = song.title;

    songLyrics.value = song.lyrics;

    editorHeading.textContent =
      "Edit Song";

    showScreen(editorScreen);

    songTitle.focus();

  }


  /* --------------------------------
     SAVE SONG
  -------------------------------- */

  function saveSong() {

    const title =
      songTitle.value.trim();

    const lyrics =
      songLyrics.value.trim();


    if (!title) {

      alert("Please enter a song title.");

      return;

    }


    if (!lyrics) {

      alert("Please enter some lyrics.");

      return;

    }


    if (editingSongId !== null) {

      const song =
        songs.find(
          s => s.id === editingSongId
        );

      if (song) {

        song.title = title;

        song.lyrics = lyrics;

      }

    } else {

      songs.push({

        id: Date.now(),

        title: title,

        lyrics: lyrics,

        // New songs start at speed 5
        speedLevel: 5

      });

    }


    saveSongs();

    renderSongList();

    showScreen(songListScreen);

  }


  /* --------------------------------
     DELETE SONG
  -------------------------------- */

  function deleteSong(id) {

    const song =
      songs.find(s => s.id === id);

    if (!song) return;


    const confirmed =
      confirm(
        `Delete "${song.title}"?`
      );

    if (!confirmed) return;


    songs =
      songs.filter(
        s => s.id !== id
      );

    saveSongs();

    renderSongList();

  }


  /* --------------------------------
     OPEN SONG
  -------------------------------- */

  function openSong(id) {

    const song =
      songs.find(s => s.id === id);

    if (!song) return;


    stopScrolling();

    currentSong = song;


    readerTitle.textContent =
      song.title;

    lyricsDisplay.textContent =
      song.lyrics;


    /*
      Load this song's saved speed.

      Old songs that don't have a
      speedLevel will use speed 5.
    */

    const savedLevel =
      Number.isInteger(song.speedLevel)
        ? song.speedLevel
        : 5;


    speedSlider.value =
      savedLevel;


    updateSpeed(false);


    lyricsDisplay.style.fontSize =
      fontSize + "px";


    showScreen(readerScreen);

  }


  /* --------------------------------
     SPEED
  -------------------------------- */

  function updateSpeed(save = true) {

    const level =
      Number(speedSlider.value);


    scrollSpeed =
      speeds[level];


    speedValue.textContent =
      level === 0
        ? "STOP"
        : level;


    /*
      Save the speed specifically
      to the current song.
    */

    if (
      save &&
      currentSong
    ) {

      currentSong.speedLevel =
        level;

      saveSongs();

    }


    /*
      Speed 0 means stop.
    */

    if (level === 0) {

      stopScrolling();

    }

  }


  /* --------------------------------
     START / PAUSE SCROLLING
  -------------------------------- */

  function toggleScrolling() {

    if (isScrolling) {

      stopScrolling();

      return;

    }


    /*
      If speed is STOP,
      start at speed 5.
    */

    if (scrollSpeed === 0) {

      speedSlider.value = 5;

      updateSpeed(true);

    }


    isScrolling = true;

    lastTime = null;


    scrollAnimation =
      requestAnimationFrame(
        scrollLyrics
      );


    updateScrollButton();

  }


  /* --------------------------------
     SCROLL ENGINE
  -------------------------------- */

  function scrollLyrics(timestamp) {

    if (!isScrolling) {

      scrollAnimation = null;

      return;

    }


    if (scrollSpeed <= 0) {

      stopScrolling();

      return;

    }


    if (lastTime === null) {

      lastTime = timestamp;

    }


    const elapsed =
      timestamp - lastTime;


    lastTime = timestamp;


    window.scrollBy(
      0,
      scrollSpeed *
      (elapsed / 1000)
    );


    scrollAnimation =
      requestAnimationFrame(
        scrollLyrics
      );

  }


  /* --------------------------------
     STOP SCROLLING
  -------------------------------- */

  function stopScrolling() {

    isScrolling = false;


    if (
      scrollAnimation !== null
    ) {

      cancelAnimationFrame(
        scrollAnimation
      );

    }


    scrollAnimation = null;

    lastTime = null;


    updateScrollButton();

  }


  /* --------------------------------
     UPDATE START BUTTON
  -------------------------------- */

  function updateScrollButton() {

    if (!topScrollButton) return;


    topScrollButton.textContent =
      isScrolling
        ? "⏸ Pause"
        : "▶ Start";

  }


  /* --------------------------------
     RESET
  -------------------------------- */

  function resetScroll() {

    stopScrolling();

    window.scrollTo(
      0,
      0
    );

  }


  /* --------------------------------
     FONT SIZE
  -------------------------------- */

  function changeFontSize(amount) {

    fontSize += amount;


    if (fontSize < 14) {

      fontSize = 14;

    }


    if (fontSize > 60) {

      fontSize = 60;

    }


    lyricsDisplay.style.fontSize =
      fontSize + "px";

  }


  /* --------------------------------
     DARK MODE
  -------------------------------- */

  function toggleDarkMode() {

    document.body.classList.toggle(
      "dark"
    );


    const isDark =
      document.body.classList.contains(
        "dark"
      );


    localStorage.setItem(
      "lyricScrollDark",
      isDark
        ? "true"
        : "false"
    );


    document.getElementById(
      "darkModeButton"
    ).textContent =
      isDark
        ? "☀️ Light"
        : "🌙 Dark";

  }


  /* --------------------------------
     LOAD DARK MODE
  -------------------------------- */

  function loadDarkMode() {

    const isDark =
      localStorage.getItem(
        "lyricScrollDark"
      ) === "true";


    if (isDark) {

      document.body.classList.add(
        "dark"
      );

    }


    document.getElementById(
      "darkModeButton"
    ).textContent =
      isDark
        ? "☀️ Light"
        : "🌙 Dark";

  }


  /* --------------------------------
     BUTTON EVENTS
  -------------------------------- */

  document
    .getElementById("addSongButton")
    .addEventListener(
      "click",
      addSong
    );


  document
    .getElementById("saveSongButton")
    .addEventListener(
      "click",
      saveSong
    );


  document
    .getElementById("cancelEditButton")
    .addEventListener(
      "click",
      () => {

        showScreen(songListScreen);

      }
    );


  document
    .getElementById("backToSongsButton")
    .addEventListener(
      "click",
      () => {

        stopScrolling();

        currentSong = null;

        showScreen(songListScreen);

      }
    );


  document
    .getElementById("resetButton")
    .addEventListener(
      "click",
      resetScroll
    );


  document
    .getElementById("fontSmallerButton")
    .addEventListener(
      "click",
      () => changeFontSize(-2)
    );


  document
    .getElementById("fontLargerButton")
    .addEventListener(
      "click",
      () => changeFontSize(2)
    );


  document
    .getElementById("darkModeButton")
    .addEventListener(
      "click",
      toggleDarkMode
    );


  document
    .getElementById("topScrollButton")
    .addEventListener(
      "click",
      toggleScrolling
    );


  /*
    Changing the speed only changes
    the speed. It does NOT start scrolling.
  */

  speedSlider.addEventListener(
    "input",
    () => updateSpeed(true)
  );


  /* --------------------------------
     INITIALIZE
  -------------------------------- */

  loadDarkMode();

  renderSongList();

  updateScrollButton();

</script>

</body>
</html>
