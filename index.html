<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Lyric Scroll</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      touch-action: manipulation;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      overflow-x: hidden;
    }

    /* =============================
       FIXED HEADER
    ============================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #f5f5f5;
      padding: 12px 15px 16px;
      border-bottom: 1px solid #ccc;
    }

    header h1 {
      margin: 0 0 10px 0;
      font-size: 22px;
    }

    .header-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      padding: 9px 13px;
      border: 1px solid #aaa;
      border-radius: 7px;
      background: #ffffff;
      color: #111111;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 130px 15px 40px;
    }

    /* =============================
       SONG LIST
    ============================= */

    .song-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f8f8f8;
    }

    .song-title {
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
    }

    .song-actions {
      display: flex;
      gap: 6px;
    }

    /* =============================
       EDITOR
    ============================= */

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 300px;
      resize: vertical;
    }

    /* =============================
       READER CONTROLS
    ============================= */

    .reader-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 15px;
    }

    .speed-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: #f5f5f5;
    }

    #speedSlider {
      width: 140px;
    }

    /* =============================
       READER VIEWPORT
    ============================= */

    #readerViewport {
      position: relative;
      overflow: hidden;
      min-height: calc(100vh - 220px);
    }

    #lyricsDisplay {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 24px;
      padding-bottom: 80vh;

      will-change: transform;

      transform: translate3d(0, 0, 0);

      touch-action: pan-y;
    }

    .hidden {
      display: none;
    }

    /* =============================
       DARK MODE
    ============================= */

    body.dark {
      background: #111111;
      color: #eeeeee;
    }

    body.dark header {
      background: #1c1c1c;
      border-bottom-color: #444444;
    }

    body.dark button {
      background: #2a2a2a;
      color: #eeeeee;
      border-color: #555555;
    }

    body.dark input[type="text"],
    body.dark textarea {
      background: #222222;
      color: #eeeeee;
      border-color: #555555;
    }

    body.dark .song-item {
      background: #1d1d1d;
      border-color: #444444;
    }

    body.dark .speed-box {
      background: #1d1d1d;
      border-color: #444444;
    }
  </style>
</head>

<body>

  <!-- =============================
       HEADER
  ============================= -->

  <header>

    <h1>🎵 Lyric Scroll</h1>

    <div class="header-buttons">

      <button onclick="showAddSong()">
        ＋ Add Song
      </button>

      <button
        id="yourSongsButton"
        onclick="showSongLibrary()"
      >
        🎵 Your Songs
      </button>

      <button
        id="scrollButton"
        onclick="toggleScrolling()"
      >
        ▶ Start
      </button>

      <button
        id="resetButton"
        onclick="resetScroll()"
        class="hidden"
      >
        ↺ Reset
      </button>

      <button
        onclick="toggleDarkMode()"
        id="darkButton"
      >
        🌙 Dark
      </button>

    </div>

  </header>


  <!-- =============================
       MAIN
  ============================= -->

  <main>

    <!-- SONG LIBRARY -->

    <section id="songListSection">

      <h2>Your Songs</h2>

      <div id="songList"></div>

      <p id="emptyMessage">
        No songs yet. Add your first song!
      </p>

    </section>


    <!-- ADD / EDIT SONG -->

    <section
      id="editorSection"
      class="hidden"
    >

      <h2 id="editorTitle">
        Add Song
      </h2>

      <div class="form-group">

        <label for="songTitle">
          Song Title
        </label>

        <input
          type="text"
          id="songTitle"
          placeholder="Enter song title"
        >

      </div>


      <div class="form-group">

        <label for="songLyrics">
          Lyrics
        </label>

        <textarea
          id="songLyrics"
          placeholder="Paste or type your lyrics here..."
        ></textarea>

      </div>


      <div class="reader-controls">

        <button onclick="saveSong()">
          Save Song
        </button>

        <button onclick="cancelEditor()">
          Cancel
        </button>

      </div>

    </section>


    <!-- READER -->

    <section
      id="readerSection"
      class="hidden"
    >

      <h2 id="readerTitle"></h2>


      <div class="reader-controls">

        <button onclick="changeFontSize(-2)">
          A−
        </button>

        <button onclick="changeFontSize(2)">
          A+
        </button>


        <div class="speed-box">

          <label
            for="speedSlider"
            style="display:inline; margin:0;"
          >
            Speed
          </label>

          <input
            type="range"
            id="speedSlider"
            min="1"
            max="10"
            step="1"
            value="5"
          >

          <span id="speedValue">
            5
          </span>

        </div>

      </div>


      <!-- LYRICS -->

      <div id="readerViewport">

        <div id="lyricsDisplay"></div>

      </div>

    </section>

  </main>


  <script>

    /* =============================
       SONG DATA
    ============================= */

    let songs = JSON.parse(
      localStorage.getItem("lyricScrollSongs") || "[]"
    );

    let currentSong = null;

    let editingSongId = null;


    /* =============================
       SCROLL SETTINGS
    ============================= */

    let fontSize = 24;

    let scrollSpeed = 30;

    let isScrolling = false;

    let scrollAnimation = null;

    let lastTime = null;

    let lyricPosition = 0;


    /*
      SPEED SCALE
    */

    const speeds = {

      1: 6,

      2: 12,

      3: 17,

      4: 23,

      5: 30,

      6: 39,

      7: 50,

      8: 62,

      9: 78,

      10: 95

    };


    /* =============================
       ELEMENTS
    ============================= */

    const songList =
      document.getElementById("songList");

    const emptyMessage =
      document.getElementById("emptyMessage");

    const songListSection =
      document.getElementById("songListSection");

    const editorSection =
      document.getElementById("editorSection");

    const readerSection =
      document.getElementById("readerSection");

    const editorTitle =
      document.getElementById("editorTitle");

    const songTitle =
      document.getElementById("songTitle");

    const songLyrics =
      document.getElementById("songLyrics");

    const readerTitle =
      document.getElementById("readerTitle");

    const lyricsDisplay =
      document.getElementById("lyricsDisplay");

    const scrollButton =
      document.getElementById("scrollButton");

    const resetButton =
      document.getElementById("resetButton");

    const speedSlider =
      document.getElementById("speedSlider");

    const speedValue =
      document.getElementById("speedValue");


    /* =============================
       SAVE SONGS
    ============================= */

    function saveSongs() {

      localStorage.setItem(
        "lyricScrollSongs",
        JSON.stringify(songs)
      );

    }


    /* =============================
       SHOW SONG LIBRARY
    ============================= */

    function showSongLibrary() {

      stopScrolling();

      currentSong = null;

      readerSection.classList.add(
        "hidden"
      );

      editorSection.classList.add(
        "hidden"
      );

      songListSection.classList.remove(
        "hidden"
      );

      resetButton.classList.add(
        "hidden"
      );

      scrollButton.classList.remove(
        "hidden"
      );

      window.scrollTo(0, 0);

    }


    /* =============================
       DISPLAY SONG LIST
    ============================= */

    function renderSongs() {

      songList.innerHTML = "";

      if (songs.length === 0) {

        emptyMessage.style.display =
          "block";

        return;
      }

      emptyMessage.style.display =
        "none";


      songs.forEach(song => {

        const item =
          document.createElement("div");

        item.className =
          "song-item";


        const title =
          document.createElement("div");

        title.className =
          "song-title";

        title.textContent =
          song.title;

        title.onclick = () =>
          openSong(song.id);


        const actions =
          document.createElement("div");

        actions.className =
          "song-actions";


        const openButton =
          document.createElement("button");

        openButton.textContent =
          "Open";

        openButton.onclick = () =>
          openSong(song.id);


        const editButton =
          document.createElement("button");

        editButton.textContent =
          "Edit";

        editButton.onclick = () =>
          editSong(song.id);


        const deleteButton =
          document.createElement("button");

        deleteButton.textContent =
          "Delete";

        deleteButton.onclick = () =>
          deleteSong(song.id);


        actions.appendChild(openButton);

        actions.appendChild(editButton);

        actions.appendChild(deleteButton);


        item.appendChild(title);

        item.appendChild(actions);


        songList.appendChild(item);

      });

    }


    /* =============================
       SHOW ADD SONG
    ============================= */

    function showAddSong() {

      stopScrolling();

      editingSongId = null;

      editorTitle.textContent =
        "Add Song";

      songTitle.value = "";

      songLyrics.value = "";


      songListSection.classList.add(
        "hidden"
      );

      readerSection.classList.add(
        "hidden"
      );

      editorSection.classList.remove(
        "hidden"
      );


      resetButton.classList.add(
        "hidden"
      );

      scrollButton.classList.remove(
        "hidden"
      );


      window.scrollTo(0, 0);

    }


    /* =============================
       EDIT SONG
    ============================= */

    function editSong(id) {

      stopScrolling();

      const song =
        songs.find(
          s => s.id === id
        );

      if (!song) return;


      editingSongId = id;

      editorTitle.textContent =
        "Edit Song";

      songTitle.value =
        song.title;

      songLyrics.value =
        song.lyrics;


      songListSection.classList.add(
        "hidden"
      );

      readerSection.classList.add(
        "hidden"
      );

      editorSection.classList.remove(
        "hidden"
      );


      resetButton.classList.add(
        "hidden"
      );

      scrollButton.classList.remove(
        "hidden"
      );


      window.scrollTo(0, 0);

    }


    /* =============================
       SAVE SONG
    ============================= */

    function saveSong() {

      const title =
        songTitle.value.trim();

      const lyrics =
        songLyrics.value;


      if (!title) {

        alert(
          "Please enter a song title."
        );

        return;
      }


      if (editingSongId !== null) {

        const song =
          songs.find(
            s => s.id === editingSongId
          );


        if (song) {

          song.title =
            title;

          song.lyrics =
            lyrics;

        }

      } else {

        songs.push({

          id: Date.now(),

          title: title,

          lyrics: lyrics,

          speedLevel: 5

        });

      }


      saveSongs();

      editingSongId = null;

      renderSongs();

      cancelEditor();

    }


    /* =============================
       CANCEL EDITOR
    ============================= */

    function cancelEditor() {

      editorSection.classList.add(
        "hidden"
      );

      readerSection.classList.add(
        "hidden"
      );

      songListSection.classList.remove(
        "hidden"
      );


      resetButton.classList.add(
        "hidden"
      );

      scrollButton.classList.remove(
        "hidden"
      );


      window.scrollTo(0, 0);

    }


    /* =============================
       DELETE SONG
    ============================= */

    function deleteSong(id) {

      const song =
        songs.find(
          s => s.id === id
        );

      if (!song) return;


      const confirmed =
        confirm(
          `Delete "${song.title}"?`
        );


      if (!confirmed) return;


      if (
        currentSong &&
        currentSong.id === id
      ) {

        stopScrolling();

        currentSong = null;

      }


      songs =
        songs.filter(
          s => s.id !== id
        );


      saveSongs();

      renderSongs();

    }


    /* =============================
       OPEN SONG
    ============================= */

    function openSong(id) {

      stopScrolling();


      const song =
        songs.find(
          s => s.id === id
        );

      if (!song) return;


      currentSong =
        song;


      readerTitle.textContent =
        song.title;


      lyricsDisplay.textContent =
        song.lyrics;


      lyricPosition = 0;


      lyricsDisplay.style.transform =
        "translate3d(0, 0, 0)";


      const savedLevel =
        Number.isInteger(
          song.speedLevel
        )
          ? song.speedLevel
          : 5;


      speedSlider.value =
        savedLevel;


      updateSpeed(false);


      songListSection.classList.add(
        "hidden"
      );

      editorSection.classList.add(
        "hidden"
      );

      readerSection.classList.remove(
        "hidden"
      );


      /*
        Show Reset only while
        inside the reader.
      */

      resetButton.classList.remove(
        "hidden"
      );


      scrollButton.classList.remove(
        "hidden"
      );


      window.scrollTo(0, 0);


      applyFontSize();

      updateScrollButton();

    }


    /* =============================
       SPEED
    ============================= */

    function updateSpeed(
      save = true
    ) {

      let level =
        Number(
          speedSlider.value
        );


      if (level < 1) {
        level = 1;
      }


      if (level > 10) {
        level = 10;
      }


      speedSlider.value =
        level;


      scrollSpeed =
        speeds[level];


      speedValue.textContent =
        level;


      if (
        save &&
        currentSong
      ) {

        currentSong.speedLevel =
          level;

        saveSongs();

      }

    }


    speedSlider.addEventListener(
      "input",
      () => updateSpeed(true)
    );


    /* =============================
       START / PAUSE
    ============================= */

    function toggleScrolling() {

      if (isScrolling) {

        stopScrolling();

        return;
      }


      isScrolling = true;

      lastTime = null;


      scrollAnimation =
        requestAnimationFrame(
          scrollLyrics
        );


      updateScrollButton();

    }


    /* =============================
       TELEPROMPTER SCROLL
    ============================= */

    function scrollLyrics(
      timestamp
    ) {

      if (!isScrolling) {

        scrollAnimation = null;

        return;
      }


      if (lastTime === null) {

        lastTime =
          timestamp;

      }


      const elapsed =
        timestamp -
        lastTime;


      lastTime =
        timestamp;


      /*
        Smooth fractional movement.
      */

      lyricPosition -=
        scrollSpeed *
        (elapsed / 1000);


      lyricsDisplay.style.transform =
        `translate3d(0, ${lyricPosition}px, 0)`;


      /*
        Stop when the lyrics
        have completely passed.
      */

      const lyricsBottom =
        lyricsDisplay.offsetTop +
        lyricsDisplay.offsetHeight +
        lyricPosition;


      if (
        lyricsBottom < 0
      ) {

        stopScrolling();

        return;
      }


      scrollAnimation =
        requestAnimationFrame(
          scrollLyrics
        );

    }


    /* =============================
       STOP SCROLLING
    ============================= */

    function stopScrolling() {

      isScrolling =
        false;


      lastTime =
        null;


      if (
        scrollAnimation !== null
      ) {

        cancelAnimationFrame(
          scrollAnimation
        );

        scrollAnimation =
          null;

      }


      updateScrollButton();

    }


    /* =============================
       UPDATE BUTTON
    ============================= */

    function updateScrollButton() {

      const text =
        isScrolling
          ? "⏸ Pause"
          : "▶ Start";


      scrollButton.textContent =
        text;

    }


    /* =============================
       RESET
    ============================= */

    function resetScroll() {

      stopScrolling();


      lyricPosition = 0;


      lyricsDisplay.style.transform =
        "translate3d(0, 0, 0)";


      window.scrollTo(
        0,
        0
      );

    }


    /* =============================
       FONT SIZE
    ============================= */

    function changeFontSize(
      amount
    ) {

      fontSize +=
        amount;


      if (fontSize < 14) {

        fontSize = 14;

      }


      if (fontSize > 60) {

        fontSize = 60;

      }


      applyFontSize();

    }


    function applyFontSize() {

      lyricsDisplay.style.fontSize =
        fontSize + "px";

    }


    /* =============================
       DARK MODE
    ============================= */

    function toggleDarkMode() {

      document.body.classList.toggle(
        "dark"
      );


      const isDark =
        document.body.classList.contains(
          "dark"
        );


      localStorage.setItem(
        "lyricScrollDark",
        isDark
      );


      updateDarkButton();

    }


    function updateDarkButton() {

      const darkButton =
        document.getElementById(
          "darkButton"
        );


      const isDark =
        document.body.classList.contains(
          "dark"
        );


      darkButton.textContent =
        isDark
          ? "☀️ Light"
          : "🌙 Dark";

    }


    /* =============================
       LOAD DARK MODE
    ============================= */

    const savedDarkMode =
      localStorage.getItem(
        "lyricScrollDark"
      );


    if (
      savedDarkMode === "true"
    ) {

      document.body.classList.add(
        "dark"
      );

    }


    /* =============================
       INITIALIZE
    ============================= */

    updateDarkButton();

    renderSongs();

    applyFontSize();

    updateScrollButton();

  </script>

</body>
</html>
