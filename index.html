<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">

<title>Lyric Scroll</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: white;
  font-family: Arial, Helvetica, sans-serif;

  /* Completely disable browser zoom/gesture behavior */
  touch-action: manipulation;
  overscroll-behavior: none;
}

body {
  overflow: hidden;
}

button,
input,
textarea {
  font: inherit;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  background: #292929;
  color: white;
}

button:active {
  transform: scale(.97);
}

.hidden {
  display: none !important;
}

/* =====================================================
   LIBRARY
===================================================== */

.screen {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  padding: 20px;
}

.library-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.library-header h1 {
  margin: 0;
  font-size: 30px;
}

.add-button {
  background: #1976d2;
  font-size: 16px;
}

.song-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.song-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #191919;
  border-radius: 12px;
  padding: 5px;
}

.song-open {
  flex: 1;
  text-align: left;
  background: transparent;
  font-size: 18px;
  padding: 15px;
}

.delete-button {
  background: #8e2020;
  font-size: 14px;
  padding: 10px 12px;
}

.empty-message {
  color: #888;
  text-align: center;
  margin-top: 60px;
  line-height: 1.6;
}

/* =====================================================
   ADD / EDIT SONG
===================================================== */

.editor {
  max-width: 700px;
  margin: 0 auto;
}

.editor h1 {
  margin-top: 0;
}

.title-input {
  width: 100%;
  background: #181818;
  color: white;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 12px;
  outline: none;
}

.lyrics-input {
  width: 100%;
  height: 55vh;
  background: #181818;
  color: white;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 14px;
  resize: none;
  outline: none;
  line-height: 1.5;
}

.editor-buttons {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.editor-buttons button {
  flex: 1;
}

.save-button {
  background: #1976d2;
}

/* =====================================================
   SCROLLER
===================================================== */

#scrollScreen {
  position: fixed;
  inset: 0;
  background: #000;
  overflow: hidden;
}

.scroll-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;

  display: flex;
  align-items: center;
  gap: 10px;

  padding: 10px;

  background: rgba(0,0,0,.92);
}

.back-button {
  flex-shrink: 0;
}

.scroll-song-title {
  flex: 1;
  min-width: 0;

  text-align: center;
  font-size: 16px;
  font-weight: bold;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.performance-button {
  flex-shrink: 0;
  background: #333;
}

/* =====================================================
   LYRICS
===================================================== */

#lyricsViewport {
  position: absolute;
  top: 55px;
  left: 0;
  right: 0;
  bottom: 145px;

  overflow: hidden;

  touch-action: pan-y;
}

#lyricsContent {
  padding: 30px 25px 400px;

  white-space: pre-wrap;
  word-wrap: break-word;

  font-size: 42px;
  line-height: 1.55;

  text-align: left;
}

/* =====================================================
   CONTROLS
===================================================== */

.controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;

  z-index: 30;

  background: rgba(15,15,15,.97);

  padding: 10px 15px 15px;
}

.control-row {
  display: flex;
  align-items: center;
  gap: 10px;

  margin-bottom: 8px;
}

.control-label {
  width: 65px;
  flex-shrink: 0;

  font-size: 13px;
  color: #aaa;
}

.slider {
  flex: 1;

  height: 30px;

  accent-color: white;
}

.control-value {
  width: 48px;
  text-align: right;
  font-size: 13px;
}

.play-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 5px;
}

.play-row button {
  min-width: 55px;
}

.play-button {
  background: #1976d2;
}

/* =====================================================
   PERFORMANCE MODE
===================================================== */

.performance-mode .scroll-top {
  display: none;
}

.performance-mode #lyricsViewport {
  top: 0;
  bottom: 0;
}

.performance-mode .controls {
  background: rgba(0,0,0,.75);
  padding-bottom: 8px;
}

.performance-mode #lyricsContent {
  padding-top: 40px;
}

/* =====================================================
   DELETE MODAL
===================================================== */

.modal-background {
  position: fixed;
  inset: 0;

  z-index: 100;

  background: rgba(0,0,0,.75);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.modal {
  width: 100%;
  max-width: 400px;

  background: #222;
  border-radius: 15px;

  padding: 20px;
}

.modal-buttons {
  display: flex;
  gap: 10px;
}

.modal-buttons button {
  flex: 1;
}

.confirm-delete {
  background: #8e2020;
}

/* =====================================================
   PERFORMANCE EXIT BUTTON
===================================================== */

.performance-exit {
  position: absolute;

  top: 12px;
  right: 12px;

  z-index: 50;

  display: none;

  background: rgba(40,40,40,.8);

  font-size: 13px;
}

.performance-mode .performance-exit {
  display: block;
}
</style>
</head>

<body>

<!-- ===================================================
     SONG LIBRARY
=================================================== -->

<div id="libraryScreen" class="screen">

  <div class="library-header">
    <h1>🎵 My Songs</h1>

    <button
      class="add-button"
      onclick="newSong()">
      ＋ Add
    </button>
  </div>

  <div id="songList" class="song-list"></div>

  <div
    id="emptyMessage"
    class="empty-message">

    No songs saved yet.<br><br>
    Tap <b>＋ Add</b> to create your first song.

  </div>

</div>


<!-- ===================================================
     SONG EDITOR
=================================================== -->

<div id="editorScreen" class="screen hidden">

  <div class="editor">

    <h1 id="editorHeading">Add Song</h1>

    <input
      id="songTitle"
      class="title-input"
      type="text"
      maxlength="100"
      placeholder="Song title">

    <textarea
      id="songLyrics"
      class="lyrics-input"
      placeholder="Paste your lyrics here..."></textarea>

    <div class="editor-buttons">

      <button onclick="cancelEdit()">
        Cancel
      </button>

      <button
        class="save-button"
        onclick="saveSong()">
        Save Song
      </button>

    </div>

  </div>

</div>


<!-- ===================================================
     SCROLLER
=================================================== -->

<div id="scrollScreen" class="hidden">

  <div class="scroll-top">

    <button
      class="back-button"
      onclick="backToLibrary()">
      ← Songs
    </button>

    <div
      id="scrollSongTitle"
      class="scroll-song-title">
    </div>

    <button onclick="editCurrentSong()">
      Edit
    </button>

  </div>


  <div id="lyricsViewport">

    <div id="lyricsContent"></div>

  </div>


  <!-- PERFORMANCE MODE EXIT -->

  <button
    class="performance-exit"
    onclick="exitPerformanceMode()">
    Exit
  </button>


  <!-- CONTROLS -->

  <div class="controls">

    <!-- SPEED -->

    <div class="control-row">

      <div class="control-label">
        Speed
      </div>

      <input
        id="speedSlider"
        class="slider"
        type="range"
        min="0.1"
        max="3"
        step="0.1"
        value="1"
        oninput="updateSpeed()">

      <div
        id="speedValue"
        class="control-value">
        1.0x
      </div>

    </div>


    <!-- FONT SIZE -->

    <div class="control-row">

      <div class="control-label">
        Font
      </div>

      <input
        id="fontSlider"
        class="slider"
        type="range"
        min="20"
        max="80"
        step="1"
        value="42"
        oninput="updateFontSize()">

      <div
        id="fontValue"
        class="control-value">
        42
      </div>

    </div>


    <!-- PLAYBACK -->

    <div class="play-row">

      <button
        class="play-button"
        id="playButton"
        onclick="toggleScroll()">
        ▶
      </button>

      <button onclick="resetScroll()">
        ↺
      </button>

      <button onclick="togglePerformanceMode()">
        🎤
      </button>

    </div>

  </div>

</div>


<!-- ===================================================
     DELETE MODAL
=================================================== -->

<div
  id="deleteModal"
  class="modal-background hidden">

  <div class="modal">

    <h2>Delete song?</h2>

    <p id="deleteMessage"></p>

    <div class="modal-buttons">

      <button onclick="closeDeleteModal()">
        Cancel
      </button>

      <button
        class="confirm-delete"
        onclick="confirmDelete()">
        Delete
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const MAX_SONGS = 50;

const STORAGE_KEY = "lyricScrollSongs";


/* =====================================================
   APP STATE
===================================================== */

let songs = [];

let editingIndex = null;

let currentSongIndex = null;

let deleteIndex = null;

let scrolling = false;

let animationFrame = null;


/* =====================================================
   LOAD SONGS
===================================================== */

function loadSongs() {

  try {

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (saved) {

      songs = JSON.parse(saved);

    }

    if (!Array.isArray(songs)) {

      songs = [];

    }

  } catch (error) {

    songs = [];

  }

  renderSongs();
}


/* =====================================================
   STORE SONGS
===================================================== */

function storeSongs() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(songs)
  );

}


/* =====================================================
   RENDER LIBRARY
===================================================== */

function renderSongs() {

  const list =
    document.getElementById("songList");

  const empty =
    document.getElementById("emptyMessage");

  list.innerHTML = "";

  if (songs.length === 0) {

    empty.classList.remove("hidden");

    return;

  }

  empty.classList.add("hidden");


  songs.forEach((song, index) => {

    const row =
      document.createElement("div");

    row.className = "song-row";


    const open =
      document.createElement("button");

    open.className = "song-open";

    open.textContent =
      song.title || "Untitled Song";

    open.onclick = function() {

      openSong(index);

    };


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-button";

    deleteButton.textContent =
      "Delete";

    deleteButton.onclick = function() {

      showDelete(index);

    };


    row.appendChild(open);

    row.appendChild(deleteButton);

    list.appendChild(row);

  });

}


/* =====================================================
   NEW SONG
===================================================== */

function newSong() {

  if (songs.length >= MAX_SONGS) {

    alert(
      "You've reached the 50-song limit."
    );

    return;

  }

  editingIndex = null;

  document.getElementById(
    "editorHeading"
  ).textContent = "Add Song";

  document.getElementById(
    "songTitle"
  ).value = "";

  document.getElementById(
    "songLyrics"
  ).value = "";

  showEditor();

}


/* =====================================================
   SHOW EDITOR
===================================================== */

function showEditor() {

  document.getElementById(
    "libraryScreen"
  ).classList.add("hidden");

  document.getElementById(
    "scrollScreen"
  ).classList.add("hidden");

  document.getElementById(
    "editorScreen"
  ).classList.remove("hidden");

}


/* =====================================================
   SAVE SONG
===================================================== */

function saveSong() {

  const title =
    document.getElementById(
      "songTitle"
    ).value.trim();

  const lyrics =
    document.getElementById(
      "songLyrics"
    ).value;


  if (!title) {

    alert(
      "Please enter a song title."
    );

    return;

  }


  if (!lyrics.trim()) {

    alert(
      "Please enter the lyrics."
    );

    return;

  }


  const song = {

    title: title,

    lyrics: lyrics

  };


  if (editingIndex === null) {

    if (songs.length >= MAX_SONGS) {

      alert(
        "You've reached the 50-song limit."
      );

      return;

    }

    songs.push(song);

  } else {

    songs[editingIndex] = song;

  }


  storeSongs();

  renderSongs();

  editingIndex = null;

  document.getElementById(
    "editorScreen"
  ).classList.add("hidden");

  document.getElementById(
    "libraryScreen"
  ).classList.remove("hidden");

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit() {

  editingIndex = null;

  document.getElementById(
    "editorScreen"
  ).classList.add("hidden");

  document.getElementById(
    "libraryScreen"
  ).classList.remove("hidden");

}


/* =====================================================
   OPEN SONG
===================================================== */

function openSong(index) {

  currentSongIndex = index;

  const song = songs[index];


  document.getElementById(
    "scrollSongTitle"
  ).textContent =
    song.title;


  document.getElementById(
    "lyricsContent"
  ).textContent =
    song.lyrics;


  document.getElementById(
    "libraryScreen"
  ).classList.add("hidden");

  document.getElementById(
    "editorScreen"
  ).classList.add("hidden");

  document.getElementById(
    "scrollScreen"
  ).classList.remove("hidden");


  resetScroll();

}


/* =====================================================
   BACK TO LIBRARY
===================================================== */

function backToLibrary() {

  stopScrolling();

  exitPerformanceMode();

  document.getElementById(
    "scrollScreen"
  ).classList.add("hidden");

  document.getElementById(
    "libraryScreen"
  ).classList.remove("hidden");

  renderSongs();

}


/* =====================================================
   EDIT CURRENT SONG
===================================================== */

function editCurrentSong() {

  if (currentSongIndex === null) {

    return;

  }


  stopScrolling();

  exitPerformanceMode();


  const song =
    songs[currentSongIndex];


  editingIndex =
    currentSongIndex;


  document.getElementById(
    "editorHeading"
  ).textContent = "Edit Song";


  document.getElementById(
    "songTitle"
  ).value =
    song.title;


  document.getElementById(
    "songLyrics"
  ).value =
    song.lyrics;


  showEditor();

}


/* =====================================================
   DELETE
===================================================== */

function showDelete(index) {

  deleteIndex = index;

  document.getElementById(
    "deleteMessage"
  ).textContent =
    'Delete "' +
    songs[index].title +
    '"?';

  document.getElementById(
    "deleteModal"
  ).classList.remove("hidden");

}


function closeDeleteModal() {

  deleteIndex = null;

  document.getElementById(
    "deleteModal"
  ).classList.add("hidden");

}


function confirmDelete() {

  if (deleteIndex === null) {

    return;

  }


  songs.splice(
    deleteIndex,
    1
  );


  storeSongs();

  renderSongs();

  closeDeleteModal();

}


/* =====================================================
   SCROLLING
===================================================== */

function toggleScroll() {

  if (scrolling) {

    stopScrolling();

  } else {

    startScrolling();

  }

}


function startScrolling() {

  scrolling = true;

  document.getElementById(
    "playButton"
  ).textContent = "⏸";

  runScroll();

}


function stopScrolling() {

  scrolling = false;

  document.getElementById(
    "playButton"
  ).textContent = "▶";


  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;

  }

}


function runScroll() {

  if (!scrolling) {

    return;

  }


  const viewport =
    document.getElementById(
      "lyricsViewport"
    );


  const speed =
    parseFloat(
      document.getElementById(
        "speedSlider"
      ).value
    );


  /*
     This keeps the movement smooth
     while letting the slider control
     the speed.
  */

  viewport.scrollTop +=
    0.45 * speed;


  if (
    viewport.scrollTop +
    viewport.clientHeight >=
    viewport.scrollHeight - 2
  ) {

    stopScrolling();

    return;

  }


  animationFrame =
    requestAnimationFrame(
      runScroll
    );

}


/* =====================================================
   RESET
===================================================== */

function resetScroll() {

  stopScrolling();

  const viewport =
    document.getElementById(
      "lyricsViewport"
    );

  viewport.scrollTop = 0;

}


/* =====================================================
   SPEED SLIDER
===================================================== */

function updateSpeed() {

  const value =
    parseFloat(
      document.getElementById(
        "speedSlider"
      ).value
    );


  document.getElementById(
    "speedValue"
  ).textContent =
    value.toFixed(1) + "x";

}


/* =====================================================
   FONT SIZE SLIDER
===================================================== */

function updateFontSize() {

  const value =
    document.getElementById(
      "fontSlider"
    ).value;


  document.getElementById(
    "lyricsContent"
  ).style.fontSize =
    value + "px";


  document.getElementById(
    "fontValue"
  ).textContent =
    value;

}


/* =====================================================
   PERFORMANCE MODE
===================================================== */

function togglePerformanceMode() {

  document
    .getElementById("scrollScreen")
    .classList.add(
      "performance-mode"
    );

}


function exitPerformanceMode() {

  document
    .getElementById("scrollScreen")
    .classList.remove(
      "performance-mode"
    );

}


/* =====================================================
   START APP
===================================================== */

loadSongs();

updateSpeed();

updateFontSize();

</script>

</body>
</html>
