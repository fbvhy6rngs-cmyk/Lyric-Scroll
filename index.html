<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Lyric Scroll</title>


<style>

/* =====================================================
   BASIC PAGE
   ===================================================== */

* {
  box-sizing: border-box;
}


html {
  scroll-behavior: auto;
}


body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f5f5f5;

  color: #111;

}


body.dark {

  background: #111;

  color: #eee;

}



/* =====================================================
   FIXED TOP BAR
   ===================================================== */

header {

  position: fixed;

  top: 0;

  left: 0;

  right: 0;

  z-index: 1000;

  background: #f5f5f5;

  padding: 12px 15px;

  border-bottom: 1px solid #ccc;

}


body.dark header {

  background: #111;

  border-bottom-color: #333;

}


h1 {

  margin: 0 0 10px;

  font-size: 22px;

}


/*
   The buttons in the top bar.
*/

header .controls {

  display: flex;

  flex-wrap: wrap;

  gap: 7px;

  margin: 0;

}



/* =====================================================
   BUTTONS
   ===================================================== */

button {

  border: none;

  border-radius: 10px;

  padding: 10px 13px;

  font-size: 16px;

  cursor: pointer;

  -webkit-tap-highlight-color:
    transparent;

}


.primary {

  background: #007aff;

  color: white;

}


.secondary {

  background: #ddd;

  color: #111;

}


body.dark .secondary {

  background: #333;

  color: white;

}


.danger {

  background: #ff3b30;

  color: white;

}



/* =====================================================
   MAIN CONTENT
   ===================================================== */

main {

  padding: 15px;

  /*
     Leave room for the fixed
     header at the top.
  */

  padding-top: 120px;

  max-width: 900px;

  margin: auto;

}



/* =====================================================
   SONG LIST
   ===================================================== */

.song-list {

  display: flex;

  flex-direction: column;

  gap: 8px;

}


.song-item {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  padding: 14px;

  border-radius: 12px;

  background: white;

  border: 1px solid #ddd;

}


body.dark .song-item {

  background: #1d1d1d;

  border-color: #333;

}


.song-name {

  flex: 1;

  font-size: 18px;

  font-weight: 600;

  cursor: pointer;

}


.song-actions {

  display: flex;

  gap: 6px;

}



/* =====================================================
   EDITOR
   ===================================================== */

.editor {

  display: none;

}


.editor.active {

  display: block;

}


input,
textarea {

  width: 100%;

  border: 1px solid #ccc;

  border-radius: 10px;

  padding: 12px;

  font-size: 17px;

  background: white;

  color: #111;

}


body.dark input,
body.dark textarea {

  background: #1d1d1d;

  color: white;

  border-color: #444;

}


textarea {

  min-height: 300px;

  resize: vertical;

  line-height: 1.5;

}


.field {

  margin-bottom: 12px;

}


.field label {

  display: block;

  margin-bottom: 5px;

  font-weight: 600;

}



/* =====================================================
   READER
   ===================================================== */

.reader {

  display: none;

}


.reader.active {

  display: block;

}


.reader-title {

  font-size: 26px;

  font-weight: 700;

  margin-bottom: 10px;

}


.lyrics {

  white-space: pre-wrap;

  line-height: 1.65;

  font-size: 26px;

  padding:

    25px

    10px

    700px;

}



/* =====================================================
   READER CONTROLS
   ===================================================== */

.reader-controls {

  position: sticky;

  top: 0;

  z-index: 100;

  background: inherit;

  padding: 8px 0;

  display: flex;

  flex-wrap: wrap;

  gap: 7px;

}


.font-size {

  display: flex;

  align-items: center;

  gap: 7px;

}



/* =====================================================
   SPEED CONTROL
   ===================================================== */

.speed-control {

  padding: 12px 0;

}


.speed-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 6px;

}


#speedValue {

  font-size: 18px;

  font-weight: 700;

}


#speedSlider {

  width: 100%;

  height: 32px;

  touch-action: none;

}


.speed-labels {

  display: flex;

  justify-content: space-between;

  font-size: 11px;

  opacity: .65;

}



/* =====================================================
   EMPTY SONG LIST
   ===================================================== */

.empty {

  opacity: .6;

  text-align: center;

  padding: 40px 10px;

}

</style>

</head>


<body>



<!-- =====================================================
     FIXED HEADER
     ===================================================== -->

<header>


<h1>
🎵 Lyric Scroll
</h1>


<div class="controls">


<!-- ADD SONG -->

<button
  class="primary"
  onclick="showEditor()">

+ Add Song

</button>


<!-- START / PAUSE -->

<button
  class="primary"
  id="topScrollButton"
  onclick="toggleScrolling()">

▶ Start

</button>


<!-- DARK MODE -->

<button
  class="secondary"
  onclick="toggleDarkMode()">

Dark Mode

</button>


</div>

</header>



<!-- =====================================================
     MAIN
     ===================================================== -->

<main>



<!-- =====================================================
     SONG LIST
     ===================================================== -->

<section id="songListView">


<h2>
My Songs
</h2>


<div
  id="songList"
  class="song-list">
</div>


</section>



<!-- =====================================================
     SONG EDITOR
     ===================================================== -->

<section
  id="editor"
  class="editor">


<h2
  id="editorHeading">

Add Song

</h2>


<div class="field">


<label for="songTitle">

Song Title

</label>


<input
  id="songTitle"
  type="text"
  placeholder="Song title">


</div>


<div class="field">


<label for="songLyrics">

Lyrics

</label>


<textarea
  id="songLyrics"
  placeholder="Paste or type your lyrics here..."></textarea>


</div>


<div class="controls">


<button
  class="primary"
  onclick="saveSong()">

Save Song

</button>


<button
  class="secondary"
  onclick="cancelEditor()">

Cancel

</button>


</div>


</section>



<!-- =====================================================
     READER
     ===================================================== -->

<section
  id="reader"
  class="reader">


<div class="reader-controls">


<button
  class="secondary"
  onclick="closeReader()">

← Songs

</button>


<button
  class="secondary"
  onclick="resetScroll()">

↺ Reset

</button>


<div class="font-size">


<button
  class="secondary"
  onclick="changeFontSize(-2)">

A−

</button>


<button
  class="secondary"
  onclick="changeFontSize(2)">

A+

</button>


</div>


</div>



<!-- SPEED -->

<div class="speed-control">


<div class="speed-header">


<span>
Scroll Speed
</span>


<strong id="speedValue">
5
</strong>


</div>


<input
  type="range"
  id="speedSlider"
  min="0"
  max="10"
  value="5"
  step="1">


<div class="speed-labels">


<span>
STOP
</span>


<span>
FAST
</span>


</div>


</div>



<!-- SONG TITLE -->

<div
  id="readerTitle"
  class="reader-title">
</div>



<!-- LYRICS -->

<div
  id="lyrics"
  class="lyrics">
</div>


</section>


</main>



<script>


/* =====================================================
   SONG STORAGE
   ===================================================== */

let songs =
  JSON.parse(
    localStorage.getItem(
      "lyricScrollSongs"
    ) || "[]"
  );


let editingSongId = null;



/* =====================================================
   DISPLAY SONGS
   ===================================================== */

function displaySongs() {


  const list =
    document.getElementById(
      "songList"
    );


  list.innerHTML = "";


  if (songs.length === 0) {


    list.innerHTML = `

      <div class="empty">

        No songs yet.<br>

        Tap
        <strong>+ Add Song</strong>
        to get started.

      </div>

    `;


    return;

  }


  songs.forEach(song => {


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "song-item";


    item.innerHTML = `

      <div
        class="song-name"
        onclick="openSong(${song.id})">

        ${escapeHTML(song.title)}

      </div>


      <div class="song-actions">


        <button
          class="secondary"
          onclick="editSong(${song.id})">

          Edit

        </button>


        <button
          class="danger"
          onclick="deleteSong(${song.id})">

          Delete

        </button>


      </div>

    `;


    list.appendChild(item);

  });

}



/* =====================================================
   ADD SONG
   ===================================================== */

function showEditor() {


  stopScrolling();


  editingSongId = null;


  document.getElementById(
    "editorHeading"
  ).textContent =
    "Add Song";


  document.getElementById(
    "songTitle"
  ).value = "";


  document.getElementById(
    "songLyrics"
  ).value = "";


  document.getElementById(
    "songListView"
  ).style.display =
    "none";


  document.getElementById(
    "reader"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "editor"
  ).classList.add(
    "active"
  );

}



/* =====================================================
   EDIT SONG
   ===================================================== */

function editSong(id) {


  const song =
    songs.find(
      s => s.id === id
    );


  if (!song) return;


  editingSongId = id;


  document.getElementById(
    "editorHeading"
  ).textContent =
    "Edit Song";


  document.getElementById(
    "songTitle"
  ).value =
    song.title;


  document.getElementById(
    "songLyrics"
  ).value =
    song.lyrics;


  document.getElementById(
    "songListView"
  ).style.display =
    "none";


  document.getElementById(
    "editor"
  ).classList.add(
    "active"
  );

}



/* =====================================================
   SAVE SONG
   ===================================================== */

function saveSong() {


  const title =
    document.getElementById(
      "songTitle"
    ).value.trim();


  const lyrics =
    document.getElementById(
      "songLyrics"
    ).value.trim();


  if (!title) {


    alert(
      "Please enter a song title."
    );


    return;

  }


  if (!lyrics) {


    alert(
      "Please enter some lyrics."
    );


    return;

  }


  if (
    editingSongId !== null
  ) {


    const song =
      songs.find(
        s =>
          s.id ===
          editingSongId
      );


    song.title = title;

    song.lyrics = lyrics;


  }

  else {


    songs.push({

      id: Date.now(),

      title: title,

      lyrics: lyrics

    });

  }


  localStorage.setItem(

    "lyricScrollSongs",

    JSON.stringify(songs)

  );


  cancelEditor();


  displaySongs();

}



/* =====================================================
   DELETE SONG
   ===================================================== */

function deleteSong(id) {


  const song =
    songs.find(
      s => s.id === id
    );


  if (!song) return;


  if (
    !confirm(
      `Delete "${song.title}"?`
    )
  ) {


    return;

  }


  songs =
    songs.filter(
      s => s.id !== id
    );


  localStorage.setItem(

    "lyricScrollSongs",

    JSON.stringify(songs)

  );


  displaySongs();

}



/* =====================================================
   CANCEL EDITOR
   ===================================================== */

function cancelEditor() {


  editingSongId = null;


  document.getElementById(
    "editor"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "songListView"
  ).style.display =
    "block";

}



/* =====================================================
   OPEN SONG
   ===================================================== */

let currentSong = null;


function openSong(id) {


  const song =
    songs.find(
      s => s.id === id
    );


  if (!song) return;


  stopScrolling();


  currentSong = song;


  document.getElementById(
    "songListView"
  ).style.display =
    "none";


  document.getElementById(
    "editor"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "reader"
  ).classList.add(
    "active"
  );


  document.getElementById(
    "readerTitle"
  ).textContent =
    song.title;


  document.getElementById(
    "lyrics"
  ).textContent =
    song.lyrics;


  window.scrollTo(
    0,
    0
  );

}



/* =====================================================
   CLOSE READER
   ===================================================== */

function closeReader() {


  stopScrolling();


  document.getElementById(
    "reader"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "songListView"
  ).style.display =
    "block";

}



/* =====================================================
   SPEED SYSTEM
   ===================================================== */

const speeds = {

  0: 0,

  1: 12,

  2: 18,

  3: 25,

  4: 33,

  5: 42,

  6: 53,

  7: 67,

  8: 84,

  9: 105,

  10: 130

};


const speedSlider =
  document.getElementById(
    "speedSlider"
  );


const speedValue =
  document.getElementById(
    "speedValue"
  );


let scrollSpeed = 42;


let isScrolling = false;


let scrollAnimation = null;


let lastTime = null;



/* =====================================================
   UPDATE SPEED
   ===================================================== */

function updateSpeed() {


  const level =
    Number(
      speedSlider.value
    );


  scrollSpeed =
    speeds[level];


  speedValue.textContent =
    level === 0
      ? "STOP"
      : level;


  /*
     Changing the slider
     NEVER starts scrolling.
  */

  if (level === 0) {

    stopScrolling();

  }

}



/* =====================================================
   SLIDER
   ===================================================== */

speedSlider.addEventListener(
  "input",
  updateSpeed
);



/* =====================================================
   SCROLL ANIMATION
   ===================================================== */

function scrollLyrics(timestamp) {


  if (!isScrolling) {


    scrollAnimation = null;


    return;

  }


  if (scrollSpeed <= 0) {


    stopScrolling();


    return;

  }


  if (lastTime === null) {


    lastTime =
      timestamp;

  }


  const elapsed =
    timestamp -
    lastTime;


  lastTime =
    timestamp;


  window.scrollBy(

    0,

    scrollSpeed *
    (elapsed / 1000)

  );


  scrollAnimation =
    requestAnimationFrame(
      scrollLyrics
    );

}



/* =====================================================
   START / PAUSE
   ===================================================== */

function toggleScrolling() {


  /*
     If currently scrolling,
     pause it.
  */

  if (isScrolling) {


    stopScrolling();


    return;

  }


  /*
     If speed is STOP and the
     user deliberately presses
     Start, use normal speed.
  */

  if (scrollSpeed === 0) {


    speedSlider.value = 5;


    updateSpeed();

  }


  /*
     NOW scrolling begins.
  */

  isScrolling = true;


  lastTime = null;


  scrollAnimation =
    requestAnimationFrame(
      scrollLyrics
    );


  updateScrollButton();

}



/* =====================================================
   STOP SCROLLING
   ===================================================== */

function stopScrolling() {


  isScrolling = false;


  if (
    scrollAnimation !== null
  ) {


    cancelAnimationFrame(
      scrollAnimation
    );

  }


  scrollAnimation = null;


  lastTime = null;


  updateScrollButton();

}



/* =====================================================
   UPDATE TOP BUTTON
   ===================================================== */

function updateScrollButton() {


  const button =
    document.getElementById(
      "topScrollButton"
    );


  if (!button) return;


  if (isScrolling) {


    button.textContent =
      "⏸ Pause";


  }

  else {


    button.textContent =
      "▶ Start";

  }

}



/* =====================================================
   RESET SCROLL
   ===================================================== */

function resetScroll() {


  stopScrolling();


  window.scrollTo({

    top: 0,

    behavior: "instant"

  });

}



/* =====================================================
   FONT SIZE
   ===================================================== */

let fontSize = 26;


function changeFontSize(amount) {


  fontSize += amount;


  if (fontSize < 16) {


    fontSize = 16;

  }


  if (fontSize > 60) {


    fontSize = 60;

  }


  document.getElementById(
    "lyrics"
  ).style.fontSize =
    fontSize + "px";

}



/* =====================================================
   DARK MODE
   ===================================================== */

function toggleDarkMode() {


  document.body.classList.toggle(
    "dark"
  );


  localStorage.setItem(

    "lyricScrollDark",

    document.body.classList.contains(
      "dark"
    )

  );

}



/* =====================================================
   RESTORE DARK MODE
   ===================================================== */

if (

  localStorage.getItem(
    "lyricScrollDark"
  ) === "true"

) {


  document.body.classList.add(
    "dark"
  );

}



/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(text) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}



/* =====================================================
   START APP
   ===================================================== */

displaySongs();


updateSpeed();


stopScrolling();

</script>


</body>

</html>
