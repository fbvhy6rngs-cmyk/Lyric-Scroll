<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111111">

  <title>Lyric Scroll</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .screen {
      min-height: 100vh;
      padding: 18px;
    }

    h1 {
      margin: 5px 0 18px;
      font-size: 28px;
    }

    h2 {
      margin-top: 0;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .primary {
      background: #1976d2;
    }

    .danger {
      background: #9b2226;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .song {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
      background: #222;
      border-radius: 12px;
    }

    .song-title {
      flex: 1;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .empty {
      color: #aaa;
      margin-top: 25px;
      line-height: 1.5;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #444;
      border-radius: 10px;
      background: #1d1d1d;
      color: white;
      padding: 12px;
      margin-bottom: 12px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #1976d2;
    }

    textarea {
      min-height: 300px;
      resize: vertical;
      line-height: 1.5;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .top-buttons button {
      flex: 1;
    }

    .save-info {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 12px;
    }

    /* SCROLLER */

    #scrollScreen {
      padding: 0;
      overflow: hidden;
      position: relative;
    }

    .scroll-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: rgba(17,17,17,.95);
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .scroll-title {
      font-size: 15px;
      font-weight: bold;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    #scrollArea {
      height: 100vh;
      overflow-y: auto;
      padding: 70px 22px 120px;
      font-size: 30px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: rgba(17,17,17,.97);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .controls button {
      min-width: 48px;
    }

    #speedDisplay {
      min-width: 55px;
      text-align: center;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    .modal-background {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: #222;
      border-radius: 15px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
    }
  </style>
</head>

<body>

  <!-- SONG LIBRARY -->
  <div id="libraryScreen" class="screen">

    <h1>🎵 My Songs</h1>

    <div class="save-info">
      Save up to 50 songs on this device.
    </div>

    <div class="top-buttons">
      <button class="primary" onclick="showNewSong()">＋ Add Song</button>
    </div>

    <div id="songList" class="song-list"></div>

    <div id="emptyMessage" class="empty">
      No saved songs yet.<br><br>
      Tap <b>＋ Add Song</b> to add your first song.
    </div>

  </div>


  <!-- ADD / EDIT SONG -->
  <div id="editScreen" class="screen hidden">

    <h1 id="editHeading">Add Song</h1>

    <input
      id="songTitle"
      type="text"
      placeholder="Song title"
      maxlength="100"
    >

    <textarea
      id="songLyrics"
      placeholder="Paste your lyrics here..."
    ></textarea>

    <div class="top-buttons">
      <button onclick="cancelEdit()">Cancel</button>
      <button class="primary" onclick="saveSong()">Save Song</button>
    </div>

  </div>


  <!-- SCROLLER -->
  <div id="scrollScreen" class="screen hidden">

    <div class="scroll-header">
      <button onclick="backToLibrary()">← Songs</button>
      <div id="scrollTitle" class="scroll-title"></div>
      <button onclick="editCurrentSong()">Edit</button>
    </div>

    <div id="scrollArea"></div>

    <div class="controls">
      <button onclick="changeSpeed(-1)">−</button>

      <div id="speedDisplay">1.0x</div>

      <button onclick="changeSpeed(1)">＋</button>

      <button onclick="toggleScroll()" id="playButton">▶</button>

      <button onclick="resetScroll()">↺</button>
    </div>

  </div>


  <!-- DELETE CONFIRMATION -->
  <div id="deleteModal" class="modal-background hidden">

    <div class="modal">

      <h2>Delete song?</h2>

      <p id="deleteMessage"></p>

      <div class="modal-buttons">
        <button onclick="closeDeleteModal()">Cancel</button>
        <button class="danger" onclick="confirmDelete()">Delete</button>
      </div>

    </div>

  </div>


<script>

  const MAX_SONGS = 50;
  const STORAGE_KEY = "lyricScrollSongs";

  let songs = [];
  let editingIndex = null;
  let currentSongIndex = null;
  let deleteIndex = null;

  let scrolling = false;
  let scrollTimer = null;
  let speed = 1.0;


  /* -----------------------------
     LOAD SAVED SONGS
  ----------------------------- */

  function loadSongs() {

    try {
      const saved = localStorage.getItem(STORAGE_KEY);

      if (saved) {
        songs = JSON.parse(saved);
      }

      if (!Array.isArray(songs)) {
        songs = [];
      }

    } catch (error) {
      songs = [];
    }

    renderSongs();
  }


  /* -----------------------------
     SAVE SONGS TO PHONE
  ----------------------------- */

  function storeSongs() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(songs)
    );

  }


  /* -----------------------------
     DISPLAY SONG LIBRARY
  ----------------------------- */

  function renderSongs() {

    const list = document.getElementById("songList");
    const empty = document.getElementById("emptyMessage");

    list.innerHTML = "";

    if (songs.length === 0) {
      empty.classList.remove("hidden");
      return;
    }

    empty.classList.add("hidden");

    songs.forEach((song, index) => {

      const row = document.createElement("div");
      row.className = "song";

      const title = document.createElement("div");
      title.className = "song-title";
      title.textContent = song.title || "Untitled Song";

      title.onclick = function() {
        openSong(index);
      };

      const deleteButton = document.createElement("button");
      deleteButton.className = "danger";
      deleteButton.textContent = "Delete";

      deleteButton.onclick = function() {
        showDelete(index);
      };

      row.appendChild(title);
      row.appendChild(deleteButton);

      list.appendChild(row);

    });

  }


  /* -----------------------------
     NEW SONG
  ----------------------------- */

  function showNewSong() {

    if (songs.length >= MAX_SONGS) {
      alert("You've reached the 50-song limit.");
      return;
    }

    editingIndex = null;

    document.getElementById("editHeading").textContent = "Add Song";
    document.getElementById("songTitle").value = "";
    document.getElementById("songLyrics").value = "";

    document.getElementById("libraryScreen").classList.add("hidden");
    document.getElementById("editScreen").classList.remove("hidden");

  }


  /* -----------------------------
     SAVE SONG
  ----------------------------- */

  function saveSong() {

    const title =
      document.getElementById("songTitle").value.trim();

    const lyrics =
      document.getElementById("songLyrics").value;

    if (!title) {
      alert("Please enter a song title.");
      return;
    }

    if (!lyrics.trim()) {
      alert("Please enter the lyrics.");
      return;
    }

    const song = {
      title: title,
      lyrics: lyrics
    };

    if (editingIndex === null) {

      if (songs.length >= MAX_SONGS) {
        alert("You've reached the 50-song limit.");
        return;
      }

      songs.push(song);

    } else {

      songs[editingIndex] = song;

    }

    storeSongs();
    renderSongs();

    editingIndex = null;

    document.getElementById("editScreen").classList.add("hidden");
    document.getElementById("libraryScreen").classList.remove("hidden");

  }


  /* -----------------------------
     CANCEL EDIT
  ----------------------------- */

  function cancelEdit() {

    editingIndex = null;

    document.getElementById("editScreen").classList.add("hidden");
    document.getElementById("libraryScreen").classList.remove("hidden");

  }


  /* -----------------------------
     OPEN SONG
  ----------------------------- */

  function openSong(index) {

    currentSongIndex = index;

    const song = songs[index];

    document.getElementById("scrollTitle").textContent =
      song.title;

    document.getElementById("scrollArea").textContent =
      song.lyrics;

    document.getElementById("libraryScreen").classList.add("hidden");
    document.getElementById("editScreen").classList.add("hidden");
    document.getElementById("scrollScreen").classList.remove("hidden");

    resetScroll();

  }


  /* -----------------------------
     BACK TO LIBRARY
  ----------------------------- */

  function backToLibrary() {

    stopScrolling();

    document.getElementById("scrollScreen").classList.add("hidden");
    document.getElementById("libraryScreen").classList.remove("hidden");

    renderSongs();

  }


  /* -----------------------------
     EDIT CURRENT SONG
  ----------------------------- */

  function editCurrentSong() {

    if (currentSongIndex === null) {
      return;
    }

    const song = songs[currentSongIndex];

    editingIndex = currentSongIndex;

    document.getElementById("editHeading").textContent =
      "Edit Song";

    document.getElementById("songTitle").value =
      song.title;

    document.getElementById("songLyrics").value =
      song.lyrics;

    stopScrolling();

    document.getElementById("scrollScreen").classList.add("hidden");
    document.getElementById("editScreen").classList.remove("hidden");

  }


  /* -----------------------------
     DELETE SONG
  ----------------------------- */

  function showDelete(index) {

    deleteIndex = index;

    document.getElementById("deleteMessage").textContent =
      'Delete "' + songs[index].title + '"?';

    document.getElementById("deleteModal").classList.remove("hidden");

  }


  function closeDeleteModal() {

    deleteIndex = null;

    document.getElementById("deleteModal").classList.add("hidden");

  }


  function confirmDelete() {

    if (deleteIndex === null) {
      return;
    }

    songs.splice(deleteIndex, 1);

    storeSongs();
    renderSongs();

    closeDeleteModal();

  }


  /* -----------------------------
     SCROLLING
  ----------------------------- */

  function toggleScroll() {

    if (scrolling) {
      stopScrolling();
    } else {
      startScrolling();
    }

  }


  function startScrolling() {

    scrolling = true;

    document.getElementById("playButton").textContent = "⏸";

    runScroll();

  }


  function stopScrolling() {

    scrolling = false;

    document.getElementById("playButton").textContent = "▶";

    if (scrollTimer) {
      cancelAnimationFrame(scrollTimer);
      scrollTimer = null;
    }

  }


  function runScroll() {

    if (!scrolling) {
      return;
    }

    const area = document.getElementById("scrollArea");

    area.scrollTop += 0.5 * speed;

    if (
      area.scrollTop + area.clientHeight >=
      area.scrollHeight - 2
    ) {
      stopScrolling();
      return;
    }

    scrollTimer = requestAnimationFrame(runScroll);

  }


  /* -----------------------------
     SPEED
  ----------------------------- */

  function changeSpeed(amount) {

    speed += amount * 0.1;

    if (speed < 0.1) {
      speed = 0.1;
    }

    if (speed > 3.0) {
      speed = 3.0;
    }

    document.getElementById("speedDisplay").textContent =
      speed.toFixed(1) + "x";

  }


  /* -----------------------------
     RESET SCROLL
  ----------------------------- */

  function resetScroll() {

    stopScrolling();

    const area = document.getElementById("scrollArea");

    area.scrollTop = 0;

  }


  /* -----------------------------
     START APP
  ----------------------------- */

  loadSongs();

</script>

</body>
</html>
